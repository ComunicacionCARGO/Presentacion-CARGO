<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Servicio a medida — Grupo CARGO</title>
  <link rel="icon" type="image/png" href="../../img/marca/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..700;1,100..700&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../compartido/base.css">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="como.css">
  <link rel="stylesheet" href="inversa.css">
</head>
<body data-volver="../../index.html">

  <div class="fondo"></div>

  <main class="escenario">

    <!-- Pista: las secciones se recorren con el scroll (textos en datos/servicio.js) -->
    <div class="pista">

      <!-- ¿Cómo lo hacemos? (entrada con las tres partes) -->
      <section class="sv-intro" data-indice="¿Cómo lo hacemos?" data-indice-tono="rojo"></section>

      <!-- Milk run: las franjas bajan por el costado y el camión las recorre con el scroll
           (la sección queda quieta mientras tanto) -->
      <section class="sv-milk" data-indice="Milk run" data-indice-tono="rojo">
        <div class="sv-fondo"></div>
        <div class="mr-fijo"></div>
      </section>

      <!-- Nuestro TMS: gestión de carga (planchada) e interfases -->
      <section class="sv-tms" data-indice="Nuestro TMS">
        <div class="sv-fondo"></div>
      </section>

      <!-- Logística inversa: simulación de un reclamo -->
      <section class="sv-inv" data-indice="Logística inversa">
        <div class="sv-fondo"></div>
      </section>

      <!-- Mapa de distribución (datos desde datos/distribucion.js, que se arma con el Excel) -->
      <section class="seccion-distribucion" data-indice="¿Dónde lo hacemos?">
        <div class="mapa-ar">
          <div class="mapa-giro"><div class="mapa-plano"></div></div>
        </div>
        <div class="mapa-etiqueta" aria-hidden="true"></div>
        <i class="registro" style="left: 64px; top: 96px"></i>
        <i class="registro" style="left: 800px; top: 96px"></i>
        <i class="registro" style="left: 64px; top: 812px"></i>
        <i class="registro" style="left: 800px; top: 812px"></i>
        <p class="mapa-pie"><b>ARG</b> 23 provincias · 5 regiones</p>

        <aside class="panel">
          <p class="panel-ante"><i class="franjitas"></i><span></span></p>
          <h1 class="panel-titulo"></h1>
          <p class="panel-bajada"></p>

          <div class="capas" role="group" aria-label="Capas del mapa"></div>

          <div class="detalle">
            <div class="vista vista-zonas"></div>
            <div class="vista vista-provincia"></div>
          </div>

          <p class="panel-ayuda">Tocá una provincia para ver qué sale desde ahí y qué llega.</p>
        </aside>
      </section>

    </div>

    <a class="volver" href="../../index.html" data-transicion>← Volver <span>Esc</span></a>
    <p class="sello"><b>02</b> | <span class="sello-texto">Servicio a medida</span></p>
  </main>

  <div class="grano"></div>
  <div class="cortina cubre"><div class="banda"></div><div class="banda"></div><div class="banda"></div></div>

  <script src="../../datos/distribucion.js"></script>
  <script src="../../datos/servicio.js"></script>
  <script src="../../compartido/base.js"></script>
  <script src="../../compartido/indice.js"></script>
  <script src="mapa-argentina.js"></script>
  <script src="diapositiva.js"></script>
  <script src="como.js"></script>
  <script src="milkrun.js"></script>
  <script src="tms.js"></script>
  <script src="inversa.js"></script>
  <script src="../../compartido/desplazamiento.js"></script>
</body>
</html>
