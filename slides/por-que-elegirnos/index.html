<html lang="es">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow">
  <title>¿Qué hacemos diferente? — Grupo CARGO</title>
  <link rel="icon" type="image/png" href="../../img/marca/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..700;1,100..700&family=Oswald:wght@500;700&display=swap">

  <link rel="stylesheet" href="estilo.css">

  <link rel="stylesheet" href="clientes.css">
</head>
<body data-volver="../../index.html">

  <main class="escenario">

    <!-- 1. ¿Qué hacemos diferente? Capas con paralaje (de atrás hacia adelante): depósito, luz y polvo,
         título, operario, degradado gris, líneas y los tres íconos que se abren como tarjetas (diapositiva.js) -->
    <section class="seccion-mejora" data-indice="¿Qué hacemos diferente?" data-indice-tono="oscuro">
      <div class="el-fondo"></div>
      <div class="df-capa" data-capa="deposito"><div class="df-deposito"></div><div class="df-luz"></div></div>
      <div class="df-capa" data-capa="polvo"><canvas class="df-polvo" width="800" height="450"></canvas></div>
      <div class="df-capa" data-capa="titulo"><h1 class="mc-titulo"><span class="mc-ante"></span><b class="mc-grande"></b></h1></div>
      <div class="df-capa" data-capa="operario"><img class="df-operario" src="../../img/slides/diferente/operario.webp" alt="" decoding="async"></div>
      <div class="df-degradado"></div>
      <div class="df-velo"></div>
      <svg class="df-lineas" viewBox="0 0 1600 900" aria-hidden="true"><defs></defs></svg>
      <div class="df-capa" data-capa="puntos"><div class="el-tarjetas"></div></div>
    </section>

    <div class="mc-tramo" aria-hidden="true">
      <!-- 2. Adaptabilidad: "Hacemos lo que Ford necesita", en cuatro pasos (adaptabilidad.js) -->
      <section class="mc-adap" data-indice="Adaptabilidad" data-indice-tono="oscuro"></section>
      <!-- 3. Mejora continua: pantalla partida Calidad / Capacitaciones (mejora.js) -->
      <section class="mc-elegir" data-indice="Mejora continua" data-indice-tono="oscuro"></section>
      <!-- 3. RSE: tablero "Hacia un impacto CERO" (rse.js), "Lo que hacemos, EN NÚMEROS" (rse-numeros.js)
           y "Acompañamos a la COMUNIDAD" (rse-comunidad.js) -->
      <div class="rse-fondo-comun" aria-hidden="true"><div class="rse-trama"></div></div>
      <section class="mc-rse" data-indice="Impacto cero"></section>
      <section class="mc-num" data-indice="En números"></section>
      <section class="mc-com" data-indice="Comunidad"></section>
      <!-- 4. Nuestros CLIENTES: logos por rubro (clientes.js, datos/clientes.js) -->
      <section class="mc-cli" data-indice="Clientes" data-indice-tono="rojo" data-indice-y="final"></section>
    </div>

    <!-- Tema abierto (Calidad o Capacitaciones) -->
    <div class="capitulo" role="dialog" aria-modal="true" aria-hidden="true"></div>

    <!-- Pista: solo da el recorrido del scroll (lo usa compartido/desplazamiento.js) -->
    <div class="pista"><div class="pista-espacio"></div></div>

    <a class="volver" href="../../index.html" data-transicion>← Volver <span>Esc</span></a>
    <p class="sello"><b>03</b> | ¿Qué hacemos diferente?</p>
  </main>

  <div class="grano"></div>
  <div class="cortina cubre"><div class="banda"></div><div class="banda"></div><div class="banda"></div></div>

  <script src="../../compartido/guia.js"></script>

  <script src="templo.js"></script>
  <script src="mejora.js"></script>
  <script src="rse-numeros.js"></script>
  <script src="rse.js"></script>
  <script src="rse-comunidad.js"></script>
  <script src="clientes.js"></script>
  <script src="../../compartido/desplazamiento.js"></script>
</body>
</html>
