<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nuestra estructura — Grupo CARGO</title>
  <link rel="icon" type="image/png" href="../../img/marca/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..700;1,100..700&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../compartido/base.css">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="mejora.css">
</head>
<body data-volver="../../index.html">

  <!-- Fondo con paralaje (se mueve con el mouse) -->
  <div class="fondo"><div class="fondo-imagen"></div></div>

  <main class="escenario">

    <!-- Escenas fijas: el scroll no las desplaza, maneja la transición de anillos -->
    <div class="escenas">
      <section class="seccion-red">
        <div class="titulo-estructura">
          <p class="te-ante"></p>
          <h1 class="te-titulo"></h1>
          <p class="te-bajada"></p>
          <p class="te-ayuda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.2V4.6a1.6 1.6 0 0 1 3.2 0v5.6h.4V8.7a1.6 1.6 0 0 1 3.2 0v1.6h.4V9.5a1.6 1.6 0 0 1 3.2 0v5.4c0 3.8-2.6 6.8-6.4 6.8h-1.1c-1.9 0-3.6-.9-4.6-2.5l-3-4.6a1.5 1.5 0 0 1 2.4-1.8L9 14.4z"/></svg><span></span></p>
        </div>

        <!-- Red: caminos curvos, mensajes que viajan y burbujas de cada área -->
        <div class="red">
          <svg class="red-caminos" viewBox="0 0 1600 900" aria-hidden="true">
            <g class="caminos"></g>
            <g class="mensajes"></g>
          </svg>
          <div class="burbujas"></div>
        </div>

        <i class="registro" style="left: 40px; top: 840px"></i>
        <i class="registro" style="left: 1542px; top: 840px"></i>
      </section>
    </div>

    <!-- Transición: anillos (rojo, rojo y gris) que se cierran desde los bordes hasta cubrir todo de gris -->
    <canvas class="anillos" aria-hidden="true"></canvas>

    <!-- 2. ¿Por qué elegirnos? El título aparece en el centro, sube y muestra las tarjetas -->
    <section class="seccion-mejora" aria-hidden="true">
      <div class="el-fondo"><div class="el-imagen"></div></div>
      <h2 class="mc-titulo"><span class="mc-ante"></span><b class="mc-grande"></b></h2>
      <div class="el-tarjetas"></div>
    </section>

    <!-- 3. Mejora continua: portada y pantalla partida Calidad / Capacitaciones (mejora.js) -->
    <div class="mc-tramo" aria-hidden="true">
      <section class="mc-portada"></section>
      <section class="mc-elegir"></section>
    </div>

    <!-- Tema abierto (Calidad o Capacitaciones) -->
    <div class="capitulo" role="dialog" aria-modal="true" aria-hidden="true"></div>

    <!-- Pista: solo da el recorrido del scroll (lo usa compartido/desplazamiento.js) -->
    <div class="pista"><div class="pista-espacio"></div></div>

    <!-- Tarjeta de cada área -->
    <div class="tarjeta-capa" aria-hidden="true">
      <article class="tarjeta-area" role="dialog" aria-modal="true" aria-labelledby="ta-titulo"></article>
    </div>

    <a class="volver" href="../../index.html" data-transicion>← Volver <span>Esc</span></a>
    <p class="sello"><b>03</b> | Nuestra estructura</p>
  </main>

  <div class="grano"></div>
  <div class="cortina cubre"><div class="banda"></div><div class="banda"></div><div class="banda"></div></div>

  <script src="../../datos/estructura.js"></script>
  <script src="../../datos/mejora-continua.js"></script>
  <script src="../../compartido/base.js"></script>
  <script src="diapositiva.js"></script>
  <script src="mejora.js"></script>
  <script src="../../compartido/desplazamiento.js"></script>
</body>
</html>
