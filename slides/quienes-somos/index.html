<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>¿Quiénes somos? — Grupo CARGO</title>
  <link rel="icon" type="image/png" href="../../img/marca/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..700;1,100..700&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="../../compartido/base.css">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="estructura.css">
  <link rel="stylesheet" href="politicas.css">
</head>
<body data-volver="../../index.html">

  <div class="fondo"></div>

  <main class="escenario">

    <!-- Capa fija: logo y pregunta (no se mueven con el scroll) -->
    <div class="fijo">
      <img class="logo" src="../../img/marca/logo-cargo.svg" alt="Grupo CARGO" decoding="async">
      <p class="pregunta"></p>
    </div>

    <!-- Pista: todo lo que se desliza hacia arriba con el scroll -->
    <div class="pista">

      <!-- 1. Franjas en V que tapan el logo al subir -->
      <section class="seccion-franjas" data-indice="Inicio">
        <svg class="franjas" viewBox="-800 0 3200 900" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="indicador-scroll"><span>Deslizá</span><i></i></div>
      </section>

      <!-- 2. 45 años -->
      <section class="seccion-45" data-indice="45 años" data-indice-tono="rojo">
        <img class="fondo-45" src="../../img/slides/quienes-somos/fondo-45.jpg" alt="45 años" decoding="async">
        <img class="camion" src="../../img/slides/quienes-somos/camion.webp" alt="" decoding="async"
             data-paralaje="-0.12">
        <p class="lema aparece"></p>
      </section>

      <!-- 3. Línea de tiempo (años, fotos y textos desde datos/quienes-somos.js) -->
      <section class="seccion-linea" data-indice="Historia" data-indice-tono="rojo">
        <div class="linea-sombra"></div>
        <h2 class="linea-titulo"></h2>
        <p class="historia"></p>
        <div class="anios"></div>
        <div class="puntos"></div>
        <div class="selector"><i class="sel-tallo"></i><span class="sel-blanco"></span><span class="sel-rojo"></span></div>
        <div class="hito">
          <div class="hito-foto"></div>
          <ul class="hito-texto"></ul>
        </div>
        <div class="linea-nav">
          <p class="linea-contador"><b>01</b><span>/ 06</span></p>
          <div class="linea-botones">
            <button class="anterior" aria-label="Año anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="siguiente" aria-label="Año siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
        </div>
      </section>

      <!-- 4. Números y mapa de sedes -->
      <section class="seccion-mapa" data-indice="Presencia">
        <div class="numeros">
          <h2 class="numeros-titulo aparece"></h2>
          <ul class="numeros-lista destacados"></ul>
          <p class="numeros-subtitulo aparece"></p>
          <ul class="numeros-lista operativos"></ul>
        </div>
        <div class="mapa">
          <div class="mapa-giro"><div class="mapa-plano"></div></div>
        </div>
        <!-- Tarjetas de cada país y líneas hacia la sede principal -->
        <div class="mapa-info"><svg class="mapa-lineas" viewBox="0 0 1600 900" aria-hidden="true"></svg></div>
      </section>

      <!-- 5. Nuestra estructura: red de áreas (estructura.js, datos/estructura.js) -->
      <section class="seccion-red seccion-estructura" data-indice="Nuestra estructura">
        <div class="est-fondo" aria-hidden="true"><div class="est-fondo-imagen"></div></div>
        <div class="titulo-estructura">
          <p class="te-ante"></p>
          <h2 class="te-titulo"></h2>
          <p class="te-bajada"></p>
          <p class="te-ayuda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.2V4.6a1.6 1.6 0 0 1 3.2 0v5.6h.4V8.7a1.6 1.6 0 0 1 3.2 0v1.6h.4V9.5a1.6 1.6 0 0 1 3.2 0v5.4c0 3.8-2.6 6.8-6.4 6.8h-1.1c-1.9 0-3.6-.9-4.6-2.5l-3-4.6a1.5 1.5 0 0 1 2.4-1.8L9 14.4z"/></svg><span></span></p>
        </div>
        <!-- Red: caminos curvos, mensajes que viajan y burbujas de cada área -->
        <div class="red">
          <svg class="red-caminos" viewBox="0 0 1600 900" aria-hidden="true">
            <g class="caminos"></g>
            <g class="mensajes"></g>
          </svg>
          <div class="burbujas"></div>
        </div>
      </section>

      <!-- 6. Políticas y Certificaciones (politicas.js, datos/mejora-continua.js). Al terminar queda
           quieta y se cierran los anillos (rojo, rojo y gris) hasta cubrir todo de gris -->
      <section class="seccion-politicas" data-indice="Políticas y Certificaciones"></section>

      <!-- 7. Logros: queda quieto en pantalla durante los anillos; al cerrarse aparecen el video gris y el título en el centro; al seguir bajando el título sube y entran las tarjetas -->
      <section class="seccion-logros" data-indice="Nuestros logros" data-indice-tono="oscuro" data-indice-y="final">
        <div class="logros-fondo" aria-hidden="true"><video src="../../img/slides/quienes-somos/logros-gris.mp4" muted loop playsinline preload="metadata"></video></div>
        <h2 class="logros-titulo"><span></span><b></b></h2>
        <p class="logros-nota"></p>
        <div class="logros-tarjetas"></div>
        <a class="logros-volver" href="../../index.html" data-transicion>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Volver
        </a>
      </section>
      <!-- Scroll extra: al seguir bajando, el título de Logros sube y entran las tarjetas -->
      <section class="seccion-cierre" aria-hidden="true"></section>

    </div>

    <!-- Tarjeta de cada área de Nuestra estructura -->
    <div class="tarjeta-capa" aria-hidden="true">
      <article class="tarjeta-area" role="dialog" aria-modal="true" aria-labelledby="ta-titulo"></article>
    </div>

    <!-- Interfaz fija por encima de todo -->
    <a class="volver" href="../../index.html" data-transicion>← Volver <span>Esc</span></a>
    <p class="sello"><b>01</b> | Quiénes somos</p>
  </main>

  <div class="grano"></div>
  <div class="cortina cubre"><div class="banda"></div><div class="banda"></div><div class="banda"></div></div>

  <script src="../../datos/quienes-somos.js"></script>
  <script src="../../datos/estructura.js"></script>
  <script src="../../datos/mejora-continua.js"></script>
  <script src="../../compartido/base.js"></script>
  <script src="../../compartido/indice.js"></script>
  <script src="mapa-sudamerica.js"></script>
  <script src="grabados.js"></script>
  <script src="diapositiva.js"></script>
  <script src="estructura.js"></script>
  <script src="politicas.js"></script>
  <script src="../../compartido/desplazamiento.js"></script>
</body>
</html>
